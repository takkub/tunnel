services:
  tunnel-web:
    build:
      context: ./web
    ports:
      - "8888:3000"
    env_file:
      - path: ./.env
        required: false
    environment:
      # Host-side absolute path to this project directory (forward slashes).
      # Needed so the web container can pass the correct host path as a volume
      # source when spawning cloudflared containers via the Docker socket.
      # Override: HOST_PROJECT_DIR=/your/path docker compose -f docker-compose-web.yml up
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-C:/Users/monch/WebstormProjects/tunnel}
    volumes:
      - ./scripts:/app/scripts
      - ./tunnels:/app/tunnels
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CLOUDFLARED_HOME:-C:/Users/monch/.cloudflared}:/root/.cloudflared
    working_dir: /app/web
    restart: unless-stopped
