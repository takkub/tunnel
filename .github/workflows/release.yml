name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install desktop dependencies
        run: npm install --prefix desktop

      - name: Build and publish desktop app
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing / notarization (optional — see docs/RELEASE.md TODO).
          # Left unset until secrets are configured; electron-builder produces
          # an unsigned build with a warning when these are empty.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist -- --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist-artifacts/*.exe
            desktop/dist-artifacts/*.dmg
            desktop/dist-artifacts/*.zip
            desktop/dist-artifacts/latest*.yml
          if-no-files-found: warn
          retention-days: 30

      # Fallback in case electron-builder's own GitHub publish step above
      # didn't run (e.g. provider misconfigured) — attaches whatever
      # installers were produced to the tag's GitHub Release.
      - name: Attach installers to release (fallback)
        if: success() || failure()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist-artifacts/*.exe
            desktop/dist-artifacts/*.dmg
            desktop/dist-artifacts/*.zip
            desktop/dist-artifacts/latest*.yml
          fail_on_unmatched_files: false
