name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install desktop dependencies
        run: npm install --prefix desktop

      # electron-builder treats an unset-but-referenced secret as an empty
      # string, and on Windows an empty CSC_LINK is parsed as a literal path
      # ("not correct, cannot resolve") instead of being ignored. So these
      # vars are only exported when the matching secret actually has a value.
      #
      # To enable signed builds later, add these repo secrets:
      #   Windows:  CSC_LINK, CSC_KEY_PASSWORD
      #   macOS:    CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
      #             APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      - name: Configure signing
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "CSC_LINK=$CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi
          # Without this, macOS electron-builder still searches the local
          # keychain for a signing identity even when CSC_LINK is unset.
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      - name: Build and publish desktop app
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      # Guards against a silent regression of the ad-hoc signing fix in
      # v1.1.15 (afterPack-adhoc-sign.js) — if the .app ships unsigned or
      # the signature is broken, fail the build loudly instead of shipping
      # a "damaged" app to users.
      - name: Verify mac signature
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          apps=$(find dist-artifacts -maxdepth 2 -name "*.app" -type d)
          if [ -z "$apps" ]; then
            echo "::error::No .app bundle found under dist-artifacts — expected at least one"
            exit 1
          fi
          status=0
          while IFS= read -r app; do
            echo "Verifying: $app"
            codesign --verify --deep --strict --verbose=2 "$app" || status=1
          done <<< "$apps"
          exit $status

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist-artifacts/*.exe
            desktop/dist-artifacts/*.dmg
            desktop/dist-artifacts/*.zip
            desktop/dist-artifacts/latest*.yml
          if-no-files-found: warn
          retention-days: 30

      # Fallback in case electron-builder's own GitHub publish step above
      # didn't run (e.g. provider misconfigured) — attaches whatever
      # installers were produced to the tag's GitHub Release.
      - name: Attach installers to release (fallback)
        if: success() || failure()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist-artifacts/*.exe
            desktop/dist-artifacts/*.dmg
            desktop/dist-artifacts/*.zip
            desktop/dist-artifacts/latest*.yml
          fail_on_unmatched_files: false
